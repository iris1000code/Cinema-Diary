<style>
:root {
  --bg:#1a1818; --bg-card:#221f1f; --bg-modal:#1e1b1b; --surface:#2a2626;
  --border:#3a3232; --border-soft:#2e2828;
  --pink:#d4869a; --pink-deep:#b8697f; --pink-pale:#e8b4c2; --pink-muted:rgba(212,134,154,0.15);
  --text:#ede8e4; --text-mid:#a89890; --text-dim:#6b5c58;
  --white:#f5f0ed; --shadow:rgba(0,0,0,0.5); --shadow-pink:rgba(212,134,154,0.12);
  --green:#6dba8a; --red:#d47070;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Jost',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}

/* ── HEADER ── */
header{position:sticky;top:0;z-index:100;background:rgba(26,24,24,0.93);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 2.5rem;display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{display:flex;flex-direction:column;gap:3px}
.logo-main{font-family:'Cormorant Garamond',serif;font-weight:300;font-style:italic;font-size:1.55rem;color:var(--text);letter-spacing:0.04em}
.logo-main span{color:var(--pink)}
.logo-sub{font-family:'Courier Prime',monospace;font-size:0.57rem;color:var(--text-dim);letter-spacing:0.28em;text-transform:uppercase}
nav{display:flex;gap:2rem;align-items:center}
nav button{background:none;border:none;font-family:'Jost',sans-serif;font-weight:300;font-size:0.73rem;letter-spacing:0.14em;color:var(--text-mid);text-transform:uppercase;cursor:pointer;transition:color 0.2s;padding:0}
nav button:hover{color:var(--pink-pale)}
#auth-btn{color:var(--text-dim)!important;font-size:0.68rem!important}
.btn-new{background:var(--pink-deep);color:var(--white);border:none;padding:0.46rem 1.25rem;font-family:'Courier Prime',monospace;font-size:0.67rem;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;border-radius:2px;transition:background 0.2s,transform 0.15s}
.btn-new:hover{background:var(--pink);transform:translateY(-1px)}
.btn-new:disabled{opacity:0.4;cursor:not-allowed;transform:none}

/* ── HERO ── */
.hero{padding:4.5rem 2.5rem 3rem;display:flex;justify-content:space-between;align-items:flex-end;border-bottom:1px solid var(--border-soft);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-80px;right:-80px;width:360px;height:360px;background:radial-gradient(circle,rgba(212,134,154,0.06) 0%,transparent 70%);pointer-events:none}
.hero-title{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:clamp(2.8rem,5.5vw,4.8rem);line-height:1.08}
.hero-title em{font-style:italic;color:var(--pink)}
.hero-stats{display:flex;gap:3rem;padding-bottom:0.4rem}
.stat{text-align:right}
.stat-num{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:2.6rem;display:block;line-height:1}
.stat-label{font-family:'Courier Prime',monospace;font-size:0.58rem;letter-spacing:0.22em;color:var(--text-dim);text-transform:uppercase;margin-top:5px;display:block}

/* ── FILTER ── */
.filter-bar{padding:1rem 2.5rem;display:flex;gap:0.5rem;align-items:center;border-bottom:1px solid var(--border-soft);flex-wrap:wrap}
.filter-label{font-family:'Courier Prime',monospace;font-size:0.58rem;letter-spacing:0.22em;color:var(--text-dim);text-transform:uppercase;margin-right:0.6rem}
.chip{padding:0.26rem 0.82rem;border:1px solid var(--border);background:transparent;border-radius:999px;font-family:'Jost',sans-serif;font-weight:300;font-size:0.7rem;color:var(--text-mid);cursor:pointer;transition:all 0.18s}
.chip:hover{border-color:var(--pink-deep);color:var(--pink-pale)}
.chip.active{background:var(--pink-muted);border-color:var(--pink-deep);color:var(--pink-pale)}

/* ── GRID ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));padding:2.2rem 2.5rem;gap:1.6rem}
@keyframes fadeUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.card{background:var(--bg-card);border:1px solid var(--border-soft);border-radius:4px;overflow:hidden;cursor:pointer;transition:transform 0.28s,box-shadow 0.28s,border-color 0.2s}
.card:hover{transform:translateY(-6px);box-shadow:0 20px 48px var(--shadow),0 4px 16px var(--shadow-pink);border-color:var(--border)}
.card-img-wrap{position:relative;overflow:hidden}
.card-img{width:100%;aspect-ratio:2/3;object-fit:cover;display:block;transition:transform 0.4s}
.card:hover .card-img{transform:scale(1.04)}
.card-placeholder{width:100%;aspect-ratio:2/3;background:linear-gradient(160deg,var(--surface) 0%,#2e2222 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--text-dim);gap:0.5rem}
.card-placeholder span{font-family:'Courier Prime',monospace;font-size:0.56rem;letter-spacing:0.15em;text-transform:uppercase;opacity:0.5}
.card-badge{position:absolute;top:0.65rem;left:0.65rem;background:rgba(26,24,24,0.85);border:1px solid var(--border);color:var(--pink-pale);font-family:'Courier Prime',monospace;font-size:0.57rem;letter-spacing:0.12em;padding:0.17rem 0.48rem;border-radius:2px;text-transform:uppercase;backdrop-filter:blur(4px)}
.card-body{padding:0.9rem 1rem 1.1rem}
.card-title{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:1.06rem;color:var(--text);line-height:1.3;margin-bottom:0.2rem}
.card-meta{font-family:'Courier Prime',monospace;font-size:0.61rem;color:var(--text-dim);letter-spacing:0.1em;margin-bottom:0.55rem}
.stars{display:flex;gap:2px;margin-bottom:0.55rem}
.star{color:var(--border);font-size:0.85rem}
.star.on{color:var(--pink)}
.card-excerpt{font-size:0.77rem;font-weight:300;line-height:1.65;color:var(--text-mid);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card-genre{display:inline-block;margin-top:0.7rem;padding:0.17rem 0.52rem;border:1px solid var(--border);font-family:'Courier Prime',monospace;font-size:0.57rem;letter-spacing:0.1em;color:var(--text-dim);border-radius:2px;text-transform:uppercase}

/* ── OVERLAYS ── */
.overlay{position:fixed;inset:0;background:rgba(8,6,6,0.75);backdrop-filter:blur(8px);z-index:200;display:none;align-items:center;justify-content:center;padding:1rem}
.overlay.open{display:flex}
.modal{background:var(--bg-modal);border:1px solid var(--border);border-radius:6px;width:100%;max-width:620px;max-height:90vh;overflow-y:auto}
.modal-sm{max-width:400px}
.modal-head{padding:1.8rem 2rem 1.3rem;border-bottom:1px solid var(--border-soft);display:flex;justify-content:space-between;align-items:flex-start}
.modal-ttl{font-family:'Cormorant Garamond',serif;font-weight:300;font-size:1.5rem;color:var(--text)}
.modal-sub{font-family:'Courier Prime',monospace;font-size:0.58rem;letter-spacing:0.22em;color:var(--text-dim);text-transform:uppercase;margin-top:4px}
.modal-x{background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--text-dim);transition:color 0.2s;line-height:1}
.modal-x:hover{color:var(--pink)}
.modal-body{padding:1.5rem 2rem 2rem}

/* ── FORM ── */
.fg{margin-bottom:1.25rem}
.fg label{display:block;font-family:'Courier Prime',monospace;font-size:0.6rem;letter-spacing:0.2em;color:var(--text-dim);text-transform:uppercase;margin-bottom:0.45rem}
input[type=text],input[type=number],input[type=email],input[type=password],textarea,select{width:100%;background:var(--surface);border:1px solid var(--border);border-radius:3px;padding:0.6rem 0.8rem;font-family:'Jost',sans-serif;font-weight:300;font-size:0.88rem;color:var(--text);outline:none;transition:border-color 0.2s,box-shadow 0.2s;-webkit-appearance:none}
input::placeholder,textarea::placeholder{color:var(--text-dim)}
input:focus,textarea:focus,select:focus{border-color:var(--pink-deep);box-shadow:0 0 0 3px rgba(212,134,154,0.1)}
select option{background:var(--surface)}
textarea{resize:vertical;min-height:90px;line-height:1.65}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.star-pick{display:flex;gap:4px;flex-direction:row-reverse;justify-content:flex-end}
.star-pick input{display:none}
.star-pick label{font-size:1.55rem;color:var(--border);cursor:pointer;transition:color 0.15s;line-height:1}
.star-pick label:hover,.star-pick label:hover~label,.star-pick input:checked~label{color:var(--pink)}

/* ── PHOTO UPLOAD ── */
.photo-drop{border:1px dashed var(--border);border-radius:4px;padding:1.4rem;text-align:center;cursor:pointer;transition:all 0.2s;position:relative;background:var(--surface)}
.photo-drop:hover{border-color:var(--pink-deep)}
.photo-drop input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.photo-drop-icon{font-size:1.6rem;opacity:0.55;margin-bottom:0.3rem}
.photo-drop p{font-family:'Courier Prime',monospace;font-size:0.6rem;letter-spacing:0.15em;color:var(--text-dim);text-transform:uppercase}
.photo-row{display:flex;gap:0.55rem;flex-wrap:wrap;margin-top:0.8rem}
.photo-thumb-wrap{position:relative;display:inline-block}
.photo-thumb{width:68px;height:68px;object-fit:cover;border-radius:3px;border:1px solid var(--border);display:block}
.photo-remove{position:absolute;top:-5px;right:-5px;background:var(--red);color:white;border:none;border-radius:50%;width:16px;height:16px;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;line-height:1;padding:0}
.photo-remove:hover{background:#b85555}

/* ── BUTTONS ── */
.btn-primary{background:var(--pink-deep);color:var(--white);border:none;padding:0.75rem 2rem;font-family:'Courier Prime',monospace;font-size:0.68rem;letter-spacing:0.18em;text-transform:uppercase;cursor:pointer;border-radius:3px;width:100%;margin-top:0.5rem;transition:background 0.2s,transform 0.15s}
.btn-primary:hover{background:var(--pink);transform:translateY(-1px)}
.btn-primary:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.btn-sec{background:transparent;color:var(--text-mid);border:1px solid var(--border);padding:0.44rem 1.1rem;font-family:'Courier Prime',monospace;font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;border-radius:3px;transition:all 0.2s;margin-top:1rem;margin-right:0.5rem}
.btn-sec:hover{border-color:var(--pink-deep);color:var(--pink-pale)}
.btn-danger{background:transparent;color:var(--text-dim);border:1px solid var(--border-soft);padding:0.44rem 1.1rem;font-family:'Courier Prime',monospace;font-size:0.6rem;letter-spacing:0.12em;text-transform:uppercase;cursor:pointer;border-radius:3px;transition:all 0.2s;margin-top:1rem}
.btn-danger:hover{border-color:#7a3333;color:var(--red)}

/* ── DETAIL MODAL ── */
.detail-cover{width:100%;max-height:280px;object-fit:cover;display:block}
.detail-cover-empty{width:100%;height:160px;background:linear-gradient(135deg,var(--surface),#2e2222);display:flex;align-items:center;justify-content:center;font-size:2.5rem;color:var(--text-dim);opacity:0.4}
.detail-stars{font-family:'Cormorant Garamond',serif;font-size:2rem;color:var(--pink);line-height:1}
.detail-stars-label{font-family:'Courier Prime',monospace;font-size:0.57rem;color:var(--text-dim);letter-spacing:0.15em;text-transform:uppercase;margin-top:4px}
.detail-review{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.02rem;line-height:1.82;color:var(--text-mid);border-left:2px solid var(--pink-deep);padding-left:1rem;margin:1rem 0}
.detail-photos{display:flex;gap:0.5rem;flex-wrap:wrap;margin-top:0.8rem}
.detail-photo{width:76px;height:76px;object-fit:cover;border-radius:3px;border:1px solid var(--border);cursor:pointer;transition:transform 0.2s}
.detail-photo:hover{transform:scale(1.05);border-color:var(--pink-deep)}

/* ── AUTH MODAL ── */
.auth-tabs{display:flex;gap:0;border-bottom:1px solid var(--border-soft);margin-bottom:1.5rem}
.auth-tab{flex:1;padding:0.6rem;font-family:'Courier Prime',monospace;font-size:0.62rem;letter-spacing:0.15em;text-transform:uppercase;color:var(--text-dim);background:none;border:none;cursor:pointer;transition:all 0.2s;border-bottom:2px solid transparent;margin-bottom:-1px}
.auth-tab.active{color:var(--pink-pale);border-bottom-color:var(--pink-deep)}
.auth-msg{font-family:'Courier Prime',monospace;font-size:0.62rem;margin-bottom:0.8rem;display:none;padding:0.5rem 0.7rem;border-radius:3px}
.auth-msg.error{display:block;color:var(--red);background:rgba(212,112,112,0.1);border:1px solid rgba(212,112,112,0.2)}
.auth-msg.success{display:block;color:var(--green);background:rgba(109,186,138,0.1);border:1px solid rgba(109,186,138,0.2)}

/* ── TOAST ── */
.toast{position:fixed;bottom:2rem;right:2rem;z-index:999;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:0.7rem 1.2rem;font-family:'Courier Prime',monospace;font-size:0.65rem;letter-spacing:0.1em;color:var(--text-mid);transform:translateY(20px);opacity:0;transition:all 0.3s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}
.toast.success{border-color:rgba(109,186,138,0.4);color:var(--green)}
.toast.error{border-color:rgba(212,112,112,0.4);color:var(--red)}

/* ── LOADING ── */
.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--pink);border-radius:50%;animation:spin 0.7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-overlay{position:fixed;inset:0;z-index:400;background:rgba(26,24,24,0.6);display:none;align-items:center;justify-content:center}
.loading-overlay.show{display:flex}
.loading-box{background:var(--bg-modal);border:1px solid var(--border);border-radius:6px;padding:2rem 3rem;text-align:center}
.loading-box p{font-family:'Courier Prime',monospace;font-size:0.65rem;letter-spacing:0.15em;color:var(--text-dim);margin-top:0.8rem;text-transform:uppercase}

/* ── EMPTY ── */
.empty{grid-column:1/-1;text-align:center;padding:6rem 2rem}
.empty-icon{font-size:2.5rem;margin-bottom:1.2rem;opacity:0.3}
.empty h3{font-family:'Cormorant Garamond',serif;font-weight:300;font-style:italic;font-size:1.5rem;color:var(--text-mid);margin-bottom:0.6rem}
.empty p{font-family:'Courier Prime',monospace;font-size:0.62rem;letter-spacing:0.16em;text-transform:uppercase;color:var(--text-dim);opacity:0.45}

/* ── SCROLLBAR ── */
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}

/* ── RESPONSIVE ── */
@media(max-width:600px){
  header{padding:0 1rem}
  .hero{flex-direction:column;gap:2rem;padding:3rem 1rem 2rem}
  .hero-stats{align-self:flex-start}
  .grid{padding:1.5rem 1rem;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:1rem}
  .filter-bar{padding:0.8rem 1rem}
  .form-row{grid-template-columns:1fr}
  .modal-body,.modal-head{padding-left:1.2rem;padding-right:1.2rem}
  nav{display:none}
  .toast{bottom:1rem;right:1rem;left:1rem}
}
</style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <div class="logo">
    <span class="logo-main">Ciné<span>Mémoire</span></span>
    <span class="logo-sub">film · series · memories</span>
  </div>
  <nav>
    <button onclick="doFilter('all')">All</button>
    <button onclick="doFilter('movie')">Films</button>
    <button onclick="doFilter('series')">Series</button>
    <button onclick="doFilterRating(4)">Top Rated</button>
    <button id="auth-btn">載入中…</button>
  </nav>
  <button class="btn-new" id="btn-new" disabled>+ New Entry</button>
</header>

<!-- ── HERO ── -->
<div class="hero">
  <div><div class="hero-title">Cinema<br><em>Diary</em></div></div>
  <div class="hero-stats">
    <div class="stat"><span class="stat-num" id="stat-total">0</span><span class="stat-label">watched</span></div>
    <div class="stat"><span class="stat-num" id="stat-avg">—</span><span class="stat-label">avg. stars</span></div>
  </div>
</div>

<!-- ── FILTER BAR ── -->
<div class="filter-bar">
  <span class="filter-label">Filter</span>
  <button class="chip active" data-filter="all">全部</button>
  <button class="chip" data-filter="movie">電影</button>
  <button class="chip" data-filter="series">影集</button>
  <button class="chip" data-filter="drama">劇情</button>
  <button class="chip" data-filter="thriller">驚悚</button>
  <button class="chip" data-filter="romance">愛情</button>
  <button class="chip" data-filter="scifi">科幻</button>
  <button class="chip" data-filter="animation">動畫</button>
  <button class="chip" data-filter="documentary">紀錄</button>
</div>

<div class="grid" id="grid"></div>

<!-- ══════════════════════════════
     ADD / EDIT MODAL
     ══════════════════════════════ -->
<div class="overlay" id="add-overlay">
  <div class="modal">
    <div class="modal-head">
      <div><div class="modal-ttl" id="add-title">新增記錄</div><div class="modal-sub">Log a new watch</div></div>
      <button class="modal-x" id="add-close">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="f-id">
      <div class="form-row">
        <div class="fg"><label>作品名稱 *</label><input type="text" id="f-title" placeholder="片名 / Title"></div>
        <div class="fg"><label>原文名稱</label><input type="text" id="f-orig" placeholder="Original Title"></div>
      </div>
      <div class="form-row">
        <div class="fg"><label>類型</label>
          <select id="f-type"><option value="movie">電影</option><option value="series">影集</option></select>
        </div>
        <div class="fg"><label>年份</label><input type="number" id="f-year" placeholder="2024" min="1888" max="2099"></div>
      </div>
      <div class="fg"><label>類別</label>
        <select id="f-genre">
          <option value="">— 選擇類別 —</option>
          <option value="drama">劇情</option><option value="thriller">驚悚</option>
          <option value="romance">愛情</option><option value="scifi">科幻</option>
          <option value="animation">動畫</option><option value="documentary">紀錄</option>
          <option value="action">動作</option><option value="horror">恐怖</option><option value="comedy">喜劇</option>
        </select>
      </div>
      <div class="fg"><label>我的評分</label>
        <div class="star-pick">
          <input type="radio" name="r" id="r5" value="5"><label for="r5">★</label>
          <input type="radio" name="r" id="r4" value="4"><label for="r4">★</label>
          <input type="radio" name="r" id="r3" value="3"><label for="r3">★</label>
          <input type="radio" name="r" id="r2" value="2"><label for="r2">★</label>
          <input type="radio" name="r" id="r1" value="1"><label for="r1">★</label>
        </div>
      </div>
      <div class="fg"><label>觀後感</label><textarea id="f-review" placeholder="Write your thoughts…"></textarea></div>
      <div class="fg">
        <label>照片（可新增 / 替換）</label>
        <div class="photo-drop" id="photo-drop">
          <input type="file" id="f-photos" accept="image/*" multiple>
          <div class="photo-drop-icon">🎞</div>
          <p>Upload poster / stills — 可多選</p>
        </div>
        <!-- existing photos (edit mode) -->
        <div id="existing-photos" style="margin-top:0.8rem"></div>
        <!-- new photos preview -->
        <div class="photo-row" id="photo-preview"></div>
      </div>
      <button class="btn-primary" id="save-btn">Save Entry</button>
    </div>
  </div>
</div>

<!-- ══════════════════════════════
     DETAIL MODAL
     ══════════════════════════════ -->
<div class="overlay" id="detail-overlay">
  <div class="modal" id="detail-inner">
    <div class="modal-head">
      <div><div class="modal-ttl" id="d-title"></div><div class="modal-sub" id="d-sub"></div></div>
      <button class="modal-x" id="detail-close">✕</button>
    </div>
    <div id="d-cover"></div>
    <div class="modal-body" style="padding-top:0">
      <div style="margin-bottom:1rem">
        <div class="detail-stars" id="d-stars"></div>
        <div class="detail-stars-label" id="d-stars-label"></div>
      </div>
      <div id="d-review"></div>
      <div id="d-photos"></div>
      <div style="margin-top:1rem">
        <button class="btn-sec" id="d-edit-btn">Edit</button>
        <button class="btn-danger" id="d-delete-btn">Delete</button>
      </div>
    </div>
  </div>
</div>

<!-- ══════════════════════════════
     AUTH MODAL (Login / Register)
     ══════════════════════════════ -->
<div class="overlay" id="auth-overlay" style="z-index:300">
  <div class="modal modal-sm">
    <div class="modal-head">
      <div><div class="modal-ttl">Welcome Back</div><div class="modal-sub">Sign in to your diary</div></div>
      <button class="modal-x" id="auth-close">✕</button>
    </div>
    <div class="modal-body">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" onclick="switchTab('login')">登入</button>
        <button class="auth-tab" id="tab-register" onclick="switchTab('register')">註冊</button>
      </div>
      <div class="fg"><label>Email</label><input type="email" id="auth-email" placeholder="your@email.com" autocomplete="email"></div>
      <div class="fg"><label>Password</label><input type="password" id="auth-password" placeholder="············" autocomplete="current-password"></div>
      <p class="auth-msg" id="auth-msg"></p>
      <button class="btn-primary" id="auth-submit">登入</button>
    </div>
  </div>
</div>

<!-- ── LOADING OVERLAY ── -->
<div class="loading-overlay" id="loading-overlay">
  <div class="loading-box">
    <div class="spinner" style="width:28px;height:28px;border-width:3px"></div>
    <p id="loading-text">Loading…</p>
  </div>
</div>

<!-- ── TOAST ── -->
<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════════
//  INIT SUPABASE
// ══════════════════════════════════════════════
const { createClient } = supabase;
const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
let db = [];
let filter = 'all';
let editId = null;
let currentDetailId = null;
let newPhotos = [];        // File objects waiting to upload
let removedPhotoUrls = []; // existing URLs marked for deletion
let currentUser = null;

const GENRES = {drama:'劇情',thriller:'驚悚',romance:'愛情',scifi:'科幻',animation:'動畫',documentary:'紀錄',action:'動作',horror:'恐怖',comedy:'喜劇'};
const BUCKET = 'diary-photos';

// ══════════════════════════════════════════════
//  UTILS
// ══════════════════════════════════════════════
function showLoading(text='Loading…') {
  document.getElementById('loading-text').textContent = text;
  document.getElementById('loading-overlay').classList.add('show');
}
function hideLoading() {
  document.getElementById('loading-overlay').classList.remove('show');
}
function showToast(msg, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' '+type : '');
  clearTimeout(t._timer);
  t._timer = setTimeout(() => t.classList.remove('show'), 3000);
}
function closeOverlay(id) { document.getElementById(id).classList.remove('open'); }
function openOverlay(id) { document.getElementById(id).classList.add('open'); }
function starsHTML(n) {
  let s = '';
  for (let i=1;i<=5;i++) s += `<span class="star${i<=n?' on':''}">★</span>`;
  return s;
}

// ══════════════════════════════════════════════
//  AUTH
// ══════════════════════════════════════════════
sb.auth.onAuthStateChange(async (event, session) => {
  currentUser = session?.user ?? null;
  updateAuthUI();
  if (currentUser) {
    closeOverlay('auth-overlay');
    await loadEntries();
  } else {
    db = [];
    render();
  }
});

function updateAuthUI() {
  const btn = document.getElementById('auth-btn');
  const newBtn = document.getElementById('btn-new');
  if (currentUser) {
    btn.textContent = '🔓 登出';
    btn.onclick = () => sb.auth.signOut();
    newBtn.disabled = false;
  } else {
    btn.textContent = '🔒 登入';
    btn.onclick = () => openOverlay('auth-overlay');
    newBtn.disabled = true;
  }
}

let authMode = 'login';
function switchTab(mode) {
  authMode = mode;
  document.getElementById('tab-login').classList.toggle('active', mode==='login');
  document.getElementById('tab-register').classList.toggle('active', mode==='register');
  document.getElementById('auth-submit').textContent = mode==='login' ? '登入' : '註冊';
  document.querySelector('#auth-overlay .modal-ttl').textContent = mode==='login' ? 'Welcome Back' : 'Create Account';
  document.getElementById('auth-msg').className = 'auth-msg';
  document.getElementById('auth-password').autocomplete = mode==='login' ? 'current-password' : 'new-password';
}

document.getElementById('auth-submit').addEventListener('click', async () => {
  const email = document.getElementById('auth-email').value.trim();
  const password = document.getElementById('auth-password').value;
  const msgEl = document.getElementById('auth-msg');
  msgEl.className = 'auth-msg';
  if (!email || !password) { msgEl.className='auth-msg error'; msgEl.textContent='請填寫 Email 與密碼'; return; }

  const btn = document.getElementById('auth-submit');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>處理中…';

  let error;
  if (authMode === 'login') {
    ({ error } = await sb.auth.signInWithPassword({ email, password }));
  } else {
    ({ error } = await sb.auth.signUp({ email, password }));
    if (!error) {
      msgEl.className='auth-msg success';
      msgEl.textContent='✓ 註冊成功！請確認 Email 後再登入';
      btn.disabled = false; btn.textContent='註冊';
      return;
    }
  }
  if (error) {
    msgEl.className='auth-msg error';
    msgEl.textContent = error.message === 'Invalid login credentials' ? '帳號或密碼錯誤' : error.message;
  }
  btn.disabled = false;
  btn.textContent = authMode==='login' ? '登入' : '註冊';
});

document.getElementById('auth-close').addEventListener('click', () => closeOverlay('auth-overlay'));
document.getElementById('auth-email').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('auth-password').focus(); });
document.getElementById('auth-password').addEventListener('keydown', e => { if(e.key==='Enter') document.getElementById('auth-submit').click(); });

// ══════════════════════════════════════════════
//  DATA — LOAD
// ══════════════════════════════════════════════
async function loadEntries() {
  showLoading('Loading diary…');
  const { data, error } = await sb.from('entries')
    .select('*')
    .order('created_at', { ascending: false });
  hideLoading();
  if (error) { showToast('載入失敗：' + error.message, 'error'); return; }
  db = data || [];
  render();
}

// ══════════════════════════════════════════════
//  DATA — SAVE
// ══════════════════════════════════════════════
async function saveEntry() {
  const titleVal = document.getElementById('f-title').value.trim();
  if (!titleVal) { showToast('請輸入作品名稱', 'error'); return; }

  const saveBtn = document.getElementById('save-btn');
  saveBtn.disabled = true;
  saveBtn.innerHTML = '<span class="spinner"></span>Saving…';

  try {
    // 1. 刪除被標記移除的舊照片
    for (const url of removedPhotoUrls) {
      const path = urlToStoragePath(url);
      if (path) await sb.storage.from(BUCKET).remove([path]);
    }

    // 2. 上傳新照片
    const uploadedUrls = [];
    for (const file of newPhotos) {
      const ext = file.name.split('.').pop();
      const path = `${currentUser.id}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
      const { error: upErr } = await sb.storage.from(BUCKET).upload(path, file, { upsert: false });
      if (upErr) { showToast('圖片上傳失敗：' + upErr.message, 'error'); continue; }
      const { data: { publicUrl } } = sb.storage.from(BUCKET).getPublicUrl(path);
      uploadedUrls.push(publicUrl);
    }

    // 3. 組合最終照片清單（保留的舊URL + 新上傳URL）
    const keepUrls = Array.from(document.querySelectorAll('#existing-photos .photo-thumb')).map(img => img.dataset.url);
    const finalPhotos = [...keepUrls, ...uploadedUrls];

    // 4. 寫入資料庫
    const rEl = document.querySelector('input[name="r"]:checked');
    const payload = {
      user_id: currentUser.id,
      title: titleVal,
      original_title: document.getElementById('f-orig').value.trim(),
      type: document.getElementById('f-type').value,
      year: document.getElementById('f-year').value || null,
      genre: document.getElementById('f-genre').value || null,
      rating: rEl ? parseInt(rEl.value) : 0,
      review: document.getElementById('f-review').value.trim(),
      photos: finalPhotos,
      updated_at: new Date().toISOString()
    };

    let error;
    if (editId) {
      ({ error } = await sb.from('entries').update(payload).eq('id', editId).eq('user_id', currentUser.id));
    } else {
      payload.created_at = new Date().toISOString();
      ({ error } = await sb.from('entries').insert(payload));
    }

    if (error) throw error;

    showToast(editId ? '✓ 更新成功' : '✓ 已記錄', 'success');
    closeOverlay('add-overlay');
    await loadEntries();

  } catch(err) {
    showToast('儲存失敗：' + err.message, 'error');
  } finally {
    saveBtn.disabled = false;
    saveBtn.textContent = 'Save Entry';
  }
}

// ══════════════════════════════════════════════
//  DATA — DELETE
// ══════════════════════════════════════════════
async function deleteEntry(id) {
  const entry = db.find(e => e.id === id);
  if (!entry) return;
  if (!confirm('確定要刪除這筆記錄嗎？')) return;

  showLoading('Deleting…');
  // 刪除所有照片
  for (const url of (entry.photos || [])) {
    const path = urlToStoragePath(url);
    if (path) await sb.storage.from(BUCKET).remove([path]);
  }
  const { error } = await sb.from('entries').delete().eq('id', id).eq('user_id', currentUser.id);
  hideLoading();
  if (error) { showToast('刪除失敗', 'error'); return; }
  showToast('已刪除', 'success');
  closeOverlay('detail-overlay');
  await loadEntries();
}

// ══════════════════════════════════════════════
//  STORAGE HELPER
// ══════════════════════════════════════════════
function urlToStoragePath(url) {
  // Extract path after /object/public/BUCKET/
  try {
    const marker = `/object/public/${BUCKET}/`;
    const idx = url.indexOf(marker);
    if (idx === -1) return null;
    return decodeURIComponent(url.slice(idx + marker.length));
  } catch { return null; }
}

// ══════════════════════════════════════════════
//  RENDER
// ══════════════════════════════════════════════
function getFiltered() {
  if (filter === 'all') return db;
  if (filter === 'movie' || filter === 'series') return db.filter(e => e.type === filter);
  return db.filter(e => e.genre === filter);
}

function render(list) {
  if (!list) list = getFiltered();
  document.getElementById('stat-total').textContent = db.length;
  document.getElementById('stat-avg').textContent = db.length
    ? (db.reduce((a,b) => a+(b.rating||0), 0)/db.length).toFixed(1) : '—';

  const g = document.getElementById('grid');
  if (!list.length) {
    g.innerHTML = `<div class="empty">
      <div class="empty-icon">🎬</div>
      <h3>${currentUser ? 'No entries yet' : 'Please sign in'}</h3>
      <p>${currentUser ? 'Click "New Entry" to start your cinema diary' : 'Click 🔒 登入 in the top right'}</p>
    </div>`;
    return;
  }
  g.innerHTML = '';
  list.forEach((e, i) => {
    const div = document.createElement('div');
    div.className = 'card';
    div.style.animation = `fadeUp 0.45s ease ${i*0.055}s both`;
    div.dataset.id = e.id;

    const imgWrap = document.createElement('div');
    imgWrap.className = 'card-img-wrap';
    if (e.photos && e.photos[0]) {
      const img = document.createElement('img');
      img.className = 'card-img'; img.src = e.photos[0]; img.alt = '';
      imgWrap.appendChild(img);
    } else {
      imgWrap.innerHTML = `<div class="card-placeholder"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1"><rect x="2" y="2" width="20" height="20" rx="2"/><circle cx="12" cy="10" r="3"/><path d="M6 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/></svg><span>no cover</span></div>`;
    }
    const badge = document.createElement('span');
    badge.className = 'card-badge';
    badge.textContent = e.type === 'movie' ? 'Film' : 'Series';
    imgWrap.appendChild(badge);

    const body = document.createElement('div');
    body.className = 'card-body';
    body.innerHTML = `<div class="card-title">${e.title}</div>
      <div class="card-meta">${e.original_title||''}${e.year?' · '+e.year:''}</div>
      <div class="stars">${starsHTML(e.rating)}</div>
      ${e.review ? `<div class="card-excerpt">${e.review}</div>` : ''}
      ${e.genre ? `<span class="card-genre">${GENRES[e.genre]||e.genre}</span>` : ''}`;

    div.appendChild(imgWrap);
    div.appendChild(body);
    div.addEventListener('click', () => openDetail(e.id));
    g.appendChild(div);
  });
}

// ══════════════════════════════════════════════
//  FILTER
// ══════════════════════════════════════════════
document.querySelector('.filter-bar').addEventListener('click', e => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  filter = chip.dataset.filter;
  render();
});
function doFilter(val) {
  filter = val;
  document.querySelectorAll('.chip').forEach(c => c.classList.toggle('active', c.dataset.filter===val));
  render();
}
function doFilterRating(min) {
  document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
  render(db.filter(e => e.rating >= min));
}

// ══════════════════════════════════════════════
//  ADD MODAL
// ══════════════════════════════════════════════
document.getElementById('btn-new').addEventListener('click', () => {
  if (!currentUser) { openOverlay('auth-overlay'); return; }
  showAddModal();
});

function showAddModal() {
  editId = null; newPhotos = []; removedPhotoUrls = [];
  document.getElementById('add-title').textContent = '新增記錄';
  document.getElementById('f-id').value = '';
  document.getElementById('f-title').value = '';
  document.getElementById('f-orig').value = '';
  document.getElementById('f-year').value = '';
  document.getElementById('f-review').value = '';
  document.getElementById('f-genre').value = '';
  document.getElementById('f-type').value = 'movie';
  document.querySelectorAll('input[name="r"]').forEach(r => r.checked = false);
  document.getElementById('photo-preview').innerHTML = '';
  document.getElementById('existing-photos').innerHTML = '';
  document.getElementById('f-photos').value = '';
  openOverlay('add-overlay');
}

document.getElementById('add-close').addEventListener('click', () => closeOverlay('add-overlay'));
document.getElementById('add-overlay').addEventListener('click', e => { if(e.target===document.getElementById('add-overlay')) closeOverlay('add-overlay'); });

// ── PHOTO HANDLING ──
document.getElementById('f-photos').addEventListener('change', e => {
  Array.from(e.target.files).forEach(file => {
    newPhotos.push(file);
    const url = URL.createObjectURL(file);
    const wrap = document.createElement('div');
    wrap.className = 'photo-thumb-wrap';
    const img = document.createElement('img');
    img.src = url; img.className = 'photo-thumb';
    const rm = document.createElement('button');
    rm.className = 'photo-remove'; rm.textContent = '×';
    rm.addEventListener('click', () => {
      newPhotos = newPhotos.filter(f => f !== file);
      wrap.remove();
    });
    wrap.appendChild(img); wrap.appendChild(rm);
    document.getElementById('photo-preview').appendChild(wrap);
  });
  e.target.value = '';
});

function renderExistingPhotos(photos) {
  const container = document.getElementById('existing-photos');
  container.innerHTML = '';
  if (!photos || !photos.length) return;
  const label = document.createElement('div');
  label.style.cssText = 'font-family:Courier Prime,monospace;font-size:0.58rem;letter-spacing:0.2em;color:var(--text-dim);text-transform:uppercase;margin-bottom:0.4rem';
  label.textContent = '現有照片（點 × 移除）';
  container.appendChild(label);
  const row = document.createElement('div');
  row.className = 'photo-row';
  photos.forEach(url => {
    const wrap = document.createElement('div');
    wrap.className = 'photo-thumb-wrap';
    const img = document.createElement('img');
    img.src = url; img.className = 'photo-thumb'; img.dataset.url = url;
    const rm = document.createElement('button');
    rm.className = 'photo-remove'; rm.textContent = '×';
    rm.addEventListener('click', () => {
      removedPhotoUrls.push(url);
      wrap.remove();
    });
    wrap.appendChild(img); wrap.appendChild(rm);
    row.appendChild(wrap);
  });
  container.appendChild(row);
}

document.getElementById('save-btn').addEventListener('click', saveEntry);

// ══════════════════════════════════════════════
//  DETAIL MODAL
// ══════════════════════════════════════════════
function openDetail(id) {
  const e = db.find(x => x.id === id);
  if (!e) return;
  currentDetailId = id;

  document.getElementById('d-title').textContent = e.title;
  document.getElementById('d-sub').textContent =
    (e.original_title||'') + (e.year?' · '+e.year:'') + ' · ' + (e.type==='movie'?'Film':'Series') + (e.genre?' · '+(GENRES[e.genre]||e.genre):'');

  const coverEl = document.getElementById('d-cover');
  if (e.photos && e.photos[0]) {
    coverEl.innerHTML = '';
    const img = document.createElement('img');
    img.className = 'detail-cover'; img.src = e.photos[0]; img.alt = '';
    coverEl.appendChild(img);
  } else {
    coverEl.innerHTML = '<div class="detail-cover-empty">🎬</div>';
  }

  document.getElementById('d-stars').textContent = e.rating
    ? '★'.repeat(e.rating)+'☆'.repeat(5-e.rating) : 'Not rated';
  document.getElementById('d-stars-label').textContent = e.rating
    ? e.rating+' / 5 stars' : 'No rating yet';

  const reviewEl = document.getElementById('d-review');
  if (e.review) {
    reviewEl.className = 'detail-review';
    reviewEl.innerHTML = e.review.replace(/\n/g,'<br>');
  } else {
    reviewEl.className = '';
    reviewEl.innerHTML = `<p style="color:var(--text-dim);font-size:0.88rem;font-style:italic;font-family:'Cormorant Garamond',serif">No review written yet.</p>`;
  }

  const photosEl = document.getElementById('d-photos');
  photosEl.innerHTML = '';
  if (e.photos && e.photos.length) {
    const label = document.createElement('div');
    label.className = 'modal-sub'; label.style.cssText = 'margin-bottom:0.5rem;margin-top:1rem';
    label.textContent = 'Photos';
    const row = document.createElement('div');
    row.className = 'detail-photos';
    e.photos.forEach(p => {
      const thumb = document.createElement('img');
      thumb.className = 'detail-photo'; thumb.src = p;
      thumb.addEventListener('click', () => window.open(p, '_blank'));
      row.appendChild(thumb);
    });
    photosEl.appendChild(label); photosEl.appendChild(row);
  }
  openOverlay('detail-overlay');
}

document.getElementById('detail-close').addEventListener('click', () => closeOverlay('detail-overlay'));
document.getElementById('detail-overlay').addEventListener('click', e => { if(e.target===document.getElementById('detail-overlay')) closeOverlay('detail-overlay'); });

document.getElementById('d-edit-btn').addEventListener('click', () => {
  const e = db.find(x => x.id === currentDetailId);
  if (!e) return;
  closeOverlay('detail-overlay');
  editId = currentDetailId;
  newPhotos = []; removedPhotoUrls = [];

  document.getElementById('add-title').textContent = '編輯記錄';
  document.getElementById('f-id').value = e.id;
  document.getElementById('f-title').value = e.title;
  document.getElementById('f-orig').value = e.original_title||'';
  document.getElementById('f-year').value = e.year||'';
  document.getElementById('f-review').value = e.review||'';
  document.getElementById('f-genre').value = e.genre||'';
  document.getElementById('f-type').value = e.type||'movie';
  document.querySelectorAll('input[name="r"]').forEach(r => r.checked = parseInt(r.value)===e.rating);
  document.getElementById('photo-preview').innerHTML = '';
  document.getElementById('f-photos').value = '';
  renderExistingPhotos(e.photos || []);
  openOverlay('add-overlay');
});

document.getElementById('d-delete-btn').addEventListener('click', () => {
  closeOverlay('detail-overlay');
  setTimeout(() => deleteEntry(currentDetailId), 150);
});

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
(async () => {
  const { data: { session } } = await sb.auth.getSession();
  currentUser = session?.user ?? null;
  updateAuthUI();
  if (currentUser) await loadEntries();
  else render();
})();
</script>
</body>
</html>
